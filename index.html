<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Today is Robin's Birthday 🎉</h1>
        <img src="./css/avatar.png" alt="Robin's photo" class="profile">
        <h2 id="age">27 years old</h2>
        <h4 id="b_date">10.05.1998</h4>
    </div>

    <div class="gift-section">
        <h2 class="gift-tittle">Here's how I am happy for you today 🥳</h2>
        <h3 class="gift-hint">(Hover over the gift)</h3>
        <div class="gift-img" id="gift-img1"></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-tittle">How people react when you enter the room 😍 </h2>
        <div class="gift-img" id="gift-img2"></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-tittle"> When you are around with friends 😎</h2>
        <div class="gift-img" id="gift-img3"></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-tittle">If I had to describe you in one word 🥹 </h2>
        <div class="gift-img" id="gift-img4"></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-tittle">This one is for you brother 😊 </h2>
        <div class="gift-img" id="gift-img5"></div>
    </div>

</body>

<footer>
    <div>
